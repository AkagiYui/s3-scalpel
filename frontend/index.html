<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The webview only ever talks to the Go side; every S3 request is made by the
      backend, so the page needs no outbound origins of its own. The exception is
      media: audio and video previews stream straight from a presigned URL on an
      arbitrary S3 endpoint, so media-src has to stay open. Image, PDF and text
      previews arrive as data: URLs and need no network at all.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'wasm-unsafe-eval';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob:;
               font-src 'self' data:;
               media-src 'self' blob: data: https: http:;
               object-src 'self' data: blob:;
               frame-src 'self' data: blob:;
               connect-src 'self' wails: ws: wss:;
               worker-src 'self' blob:;
               base-uri 'self';
               form-action 'none';
               frame-ancestors 'none'"
    />
    <title>S3 Scalpel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
